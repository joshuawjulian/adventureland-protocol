/* Filters */
const filtersEl = document.getElementById("filters");
function renderFilters() {
  const counts = Object.fromEntries(KINDS.map((k) => [k.id, items.filter((i) => i.kind === k.id).length]));
  const chip = (id, label, color, n) =>
    `<button type="button" class="chip" data-kind="${id}" aria-pressed="${kindFilter === id}" style="--k:${color}">` +
    `${color ? "<i></i>" : ""}${label} <b>${n}</b></button>`;
  filtersEl.hidden = KINDS.length < 2;
  filtersEl.innerHTML =
    chip("all", "All", "", items.length) + KINDS.map((k) => chip(k.id, k.label, k.color, counts[k.id])).join("");
}
filtersEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-kind]");
  if (!b) return;
  kindFilter = b.dataset.kind;
  store.set(`alapi.kind.${PAGE.id}`, kindFilter);
  renderFilters();
  renderIndex();
});

/* Search: every word must match somewhere; the name counts most, then the summary, then the body. */
function score(i, words, q) {
  let s = 0;
  if (i._name === q) s += 1000;
  else if (i._name.startsWith(q)) s += 400;
  else if (i._name.includes(q)) s += 250;
  for (const w of words) {
    if (i._name.includes(w)) s += 60;
    else if (i._sum.includes(w)) s += 25;
    else if (i._body.includes(w)) s += 6;
    else return 0;
  }
  if (i.kind === "send" || i.kind === "recv") s += 2; // events edge out codes on ties
  return s;
}

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function highlight(text, words) {
  let out = esc(text);
  for (const w of words) {
    if (w.length < 2) continue;
    out = out.replace(new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})(?![^<]*>)`, "gi"), "<mark>$1</mark>");
  }
  return out;
}

/* A short excerpt around the first match in the body, for results matched only there. */
function snippet(i, words) {
  const w = words.find((w) => i._body.includes(w) && !i._name.includes(w) && !i._sum.includes(w));
  if (!w) return i.summary || "";
  const text = plain(i.md).replace(/\s+/g, " ");
  const at = text.indexOf(w);
  const start = Math.max(0, at - 50);
  return (start ? "…" : "") + text.slice(start, at + 90) + "…";
}

const indexEl = document.getElementById("index");
const LIMIT = 250;

function row(i, words) {
  const k = KIND[i.kind];
  const badge = i.badge ? `<small>${i.badge}</small>` : "";
  const sum = words.length ? snippet(i, words) : i.summary || "";
  return (
    `<li><a class="row" href="#${i.id}" data-id="${i.id}" style="--k:${k.color}"${i.id === current?.id ? ' aria-current="true"' : ""}>` +
    `<span class="tag">${i.num ? String(i.num).padStart(2, "0") : k.tag}</span>` +
    `<span class="name${i.num ? " prose" : ""}">${highlight(i.name, words)}${badge}</span>` +
    `<span class="sum">${highlight(sum, words)}</span></a></li>`
  );
}

function renderIndex() {
  const q = query.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  let pool = kindFilter === "all" ? items : items.filter((i) => i.kind === kindFilter);
  let html = "";
  if (words.length) {
    const ranked = pool
      .map((i) => [score(i, words, q), i])
      .filter(([s]) => s > 0)
      .sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name))
      .map(([, i]) => i);
    shown = ranked.slice(0, LIMIT);
    html += `<div class="status" role="status">${ranked.length} match${ranked.length === 1 ? "" : "es"} for “${esc(query.trim())}”</div>`;
    html += shown.length
      ? `<ul class="list">${shown.map((i) => row(i, words)).join("")}</ul>`
      : `<div class="empty">Nothing matches. Try fewer words, or a field name like <code>num</code> or a code like <code>too_far</code>.</div>`;
    if (ranked.length > LIMIT) html += `<div class="more">Showing the best ${LIMIT}. Add a word to narrow it down.</div>`;
  } else {
    shown = [];
    const kinds = kindFilter === "all" ? KINDS : [KIND[kindFilter]];
    for (const k of kinds) {
      const ofKind = pool.filter((i) => i.kind === k.id);
      const groups = [...new Set(ofKind.map((i) => i.group))];
      for (const g of groups) {
        const inGroup = ofKind.filter((i) => i.group === g);
        const title = kinds.length > 1 && g !== k.label ? `${k.label} · ${g}` : g;
        html += `<div class="group-h" style="--k:${k.color}"><span>${esc(title)}</span><span>${inGroup.length}</span></div>`;
        html += `<ul class="list">${inGroup.map((i) => row(i, [])).join("")}</ul>`;
        shown.push(...inGroup);
      }
    }
  }
  indexEl.innerHTML = html;
}

/* Reader */
const readerEl = document.getElementById("reader");
/* Source citations: `node/server.js:123`, `api.js:88-92`, `sf:12` become links to that line at
   the pinned commit (DATA.source, from versions.json). Three repos:
     bare        the live game, kaansoral/adventureland_mongodb (the source of truth)
     common:     its shared engine, kaansoral/common_engine
     legacy:     the old App Engine version, frozen; only for historical notes
   A bare name links only if it has a folder (node/x.js), is a short alias below, or is one of
   the live repo's top-level files; that keeps `Game.js:12` (some other project) from becoming a
   wrong link. Hard-coded from the live repo's layout on 2026-10-04. */
const REPOS = { "": DATA.source.live, common: DATA.source.common, legacy: DATA.source.legacy };
const ALIAS = {
  "": { "server.js": "node/server.js", "server_functions.js": "node/server_functions.js", sf: "node/server_functions.js",
        "common_functions.js": "js/old_common_functions.js", "game.js": "js/game.js" },
  common: {},
  legacy: { "server.js": "node/server.js", "server_functions.js": "node/server_functions.js", sf: "node/server_functions.js",
            "common_functions.js": "js/common_functions.js", "game.js": "js/game.js", "api.py": "api.py", "main.py": "main.py" },
};
const ROOT_FILES = new Set([
  "admin_bots.js", "admin_dashboard.js", "adventure_functions.js", "api.js", "crons.js", "filters.js", "main.js", "mainframe.js", "mcp_api.js", "models.js", "seo_paths.js", "steam_news.js", "steam_signin.js", "steam_signup.js", "update_notes.js", "version.js", "web_assets.js"
]);
const SRC_RE = /\b(?:(common|legacy):)?((?:[\w.-]+\/)*[\w.-]+\.(?:js|py|html)|sf):(\d+)(?:\s*[-–]\s*(\d+))?/g;
function srcHref(prefix, file, a, b) {
  const repo = REPOS[prefix || ""];
  const path = ALIAS[prefix || ""][file] ?? (file.includes("/") || (prefix && prefix !== "legacy") || ROOT_FILES.has(file) ? file : null);
  if (!repo || !path || (prefix === "legacy" && !path.includes("/") && !/\.py$/.test(path))) return null;
  return `${repo.repo}/blob/${repo.commit}/${path}#L${a}${b ? `-L${b}` : ""}`;
}

/* After Markdown is rendered: wrap tables so they scroll, link source refs, cross-link names. */
function enhance(root, fromKind, selfId) {
  for (const img of root.querySelectorAll("p > img:only-child")) {
    const p = img.parentElement;
    if (p.textContent.trim()) continue; // an image inside a sentence stays inline
    const fig = document.createElement("figure");
    img.loading = "lazy";
    fig.append(img);
    if (img.title) {
      const cap = document.createElement("figcaption");
      cap.textContent = img.title;
      fig.append(cap);
      img.removeAttribute("title");
    }
    p.replaceWith(fig);
  }
  for (const t of root.querySelectorAll("table")) {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.replaceWith(wrap);
    wrap.append(t);
  }
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const texts = [];
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (!n.parentElement.closest("a, pre") && SRC_RE.test(n.nodeValue)) texts.push(n);
    SRC_RE.lastIndex = 0;
  }
  for (const n of texts) {
    const frag = document.createDocumentFragment();
    let last = 0;
    n.nodeValue.replace(SRC_RE, (m, prefix, file, a, b, at) => {
      frag.append(n.nodeValue.slice(last, at));
      const href = srcHref(prefix, file, a, b);
      if (href) {
        const link = document.createElement("a");
        link.className = "src";
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = m;
        frag.append(link);
      } else frag.append(m);
      last = at + m.length;
      return m;
    });
    frag.append(n.nodeValue.slice(last));
    n.replaceWith(frag);
  }
  for (const a of root.querySelectorAll('a[href^="#"]')) {
    const href = hrefOf(decodeURIComponent(a.getAttribute("href").slice(1)));
    if (href) a.setAttribute("href", href);
  }
  for (const c of root.querySelectorAll("code")) {
    if (c.closest("a, pre")) continue;
    const name = c.textContent.trim();
    if (!/^[a-z0-9_:]+$/i.test(name)) continue;
    const target = resolveName(name, fromKind);
    if (!target || target.id === selfId) continue;
    const a = document.createElement("a");
    a.className = "xref";
    a.href = hrefOf(target.id);
    a.title = `${KIND[target.kind].long}: ${target.name}`;
    c.replaceWith(a);
    a.append(c);
  }
  codeTabs(root);
}

/* Code examples. A run of adjacent fenced blocks tagged with the course's languages becomes
   one tabbed example showing the reader's language; any other fenced block just gets
   highlighted. The choice lives in localStorage ("alapi.lang"), shared by all three pages. */
const LANGS = [
  { id: "js", label: "JavaScript", hl: "javascript" },
  { id: "ts", label: "TypeScript", hl: "typescript" },
  { id: "python", label: "Python", hl: "python" },
  { id: "go", label: "Go", hl: "go" },
  { id: "csharp", label: "C#", hl: "csharp" },
  { id: "rust", label: "Rust", hl: "rust" },
  { id: "java", label: "Java", hl: "java" },
];
const LANG = Object.fromEntries(LANGS.map((l) => [l.id, l]));
// Aliases writers might use in a fence; they're normalised to the ids above.
const LANG_ALIAS = { javascript: "js", typescript: "ts", py: "python", "c#": "csharp", cs: "csharp", golang: "go", rs: "rust" };
let lang = LANG[store.get("alapi.lang")] ? store.get("alapi.lang") : "js";

const fenceLang = (pre) => {
  const m = pre.querySelector("code")?.className.match(/language-(\S+)/);
  if (!m) return null;
  const id = LANG_ALIAS[m[1].toLowerCase()] ?? m[1].toLowerCase();
  return LANG[id] ? id : null;
};

function hl(pre, langId) {
  const code = pre.querySelector("code");
  if (!window.hljs || !code || code.dataset.hl) return;
  const m = code.className.match(/language-(\S+)/);
  const name = LANG[langId]?.hl ?? (m && hljs.getLanguage(m[1]) ? m[1] : null);
  if (!name) return;
  code.innerHTML = hljs.highlight(code.textContent, { language: name, ignoreIllegals: true }).value;
  code.dataset.hl = "1";
}

function codeTabs(root) {
  const pres = [...root.querySelectorAll("pre")];
  const seen = new Set();
  for (const pre of pres) {
    if (seen.has(pre)) continue;
    if (!fenceLang(pre)) { hl(pre); continue; }
    // Collect this block and the fenced siblings straight after it.
    const run = [pre];
    let n = pre.nextElementSibling;
    while (n && n.tagName === "PRE" && fenceLang(n) && !run.some((p) => fenceLang(p) === fenceLang(n))) {
      run.push(n);
      n = n.nextElementSibling;
    }
    run.forEach((p) => seen.add(p));
    // A lone block (a Node test server, a one-off snippet) is just code, not a choice.
    if (run.length === 1) { hl(pre, fenceLang(pre)); continue; }
    const box = document.createElement("div");
    box.className = "codetabs";
    const bar = document.createElement("div");
    bar.className = "tabbar";
    bar.setAttribute("role", "tablist");
    box.append(bar);
    pre.before(box);
    for (const p of run) {
      const id = fenceLang(p);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab";
      b.setAttribute("role", "tab");
      b.dataset.lang = id;
      b.textContent = LANG[id].label;
      bar.append(b);
      p.dataset.lang = id;
      hl(p, id);
      box.append(p);
    }
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "copy";
    copy.textContent = "Copy";
    bar.append(copy);
    const note = document.createElement("div");
    note.className = "note";
    box.insertBefore(note, bar.nextSibling);
  }
  applyLang(root);
}

/* Show each tab group in the chosen language, or its first block plus a note if it has none. */
function applyLang(root = readerEl) {
  for (const box of root.querySelectorAll(".codetabs")) {
    const have = [...box.querySelectorAll("pre")].map((p) => p.dataset.lang);
    const pick = have.includes(lang) ? lang : have[0];
    for (const p of box.querySelectorAll("pre")) p.hidden = p.dataset.lang !== pick;
    for (const b of box.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.lang === pick));
    const note = box.querySelector(".note");
    note.hidden = pick === lang || have.length < 2;
    note.textContent = `No ${LANG[lang].label} version of this one; showing ${LANG[pick].label}.`;
  }
}

function setLang(id, anchor) {
  if (!LANG[id]) return;
  lang = id;
  store.set("alapi.lang", id);
  langEl.value = id;
  // Switching changes block heights above the clicked example; keep it under the pointer.
  const before = anchor?.getBoundingClientRect().top;
  applyLang();
  if (anchor) readerEl.scrollTop += anchor.getBoundingClientRect().top - before;
}

const langEl = document.getElementById("lang");
langEl.innerHTML = LANGS.map((l) => `<option value="${l.id}">${l.label}</option>`).join("");
langEl.value = lang;
langEl.addEventListener("change", () => setLang(langEl.value));

function startPage() {
  const counts = KINDS.map((k) => ({ k, n: items.filter((i) => i.kind === k.id).length }));
  return (
    `<div class="stats">` +
    counts.map(({ k, n }) => `<button type="button" class="stat" data-filter="${k.id}" style="--k:${k.color}"><b>${n}</b><span>${k.long}</span></button>`).join("") +
    `</div>`
  );
}

function footer() {
  const short = DATA.source.live.commit.slice(0, 7);
  return (
    `<footer class="foot">An unofficial reference for <a href="https://adventure.land">Adventure Land</a>, ` +
    `written from the game's open-source code (<a href="${DATA.source.live.repo}">kaansoral/adventureland_mongodb</a>, commit ` +
    `<a href="${DATA.source.live.repo}/tree/${DATA.source.live.commit}"><code>${short}</code></a>). ` +
    `The pictures use the game's own art and screenshots from the same repository. Adventure Land, its code and its art belong to their author.</footer>`
  );
}

/* Previous / next links, for reading the course and the guide front to back. */
function pager(i) {
  if (!i.num) return "";
  const at = items.indexOf(i);
  const link = (j, cls, label) =>
    j ? `<a class="${cls}" href="#${j.id}"><span>${label}</span>${esc(j.num)}. ${esc(j.name)}</a>` : "";
  return `<nav class="pager" aria-label="Chapters">${link(items[at - 1], "prev", "← Previous")}${link(items[at + 1], "next", "Next →")}</nav>`;
}

function show(id, { focus = false } = {}) {
  const i = byId.get(id) ?? byId.get(HOME);
  current = i;
  const k = KIND[i.kind];
  const isCode = !["guide", "learn", "game"].includes(i.kind) && !/\s/.test(i.name);
  const actions = [];
  if (i.emit) actions.push(`<button type="button" class="btn" data-copy="${esc(i.emit)}">Copy <code>${esc(i.emit.length > 46 ? i.emit.slice(0, 44) + "…" : i.emit)}</code></button>`);
  if (isCode) actions.push(`<button type="button" class="btn" data-copy-name="${esc(i.name)}">Copy name</button>`);
  readerEl.innerHTML =
    `<article class="doc">` +
    `<button type="button" class="btn back" data-back>← Index</button>` +
    `<div class="crumbs" style="--k:${k.color}"><span class="kind-pill">${k.tag}</span><span>${esc(k.long)}</span>${i.group && i.group !== k.label ? `<span>›</span><span>${esc(i.group)}</span>` : ""}</div>` +
    `<h2 class="title${isCode ? " mono" : ""}">${esc(i.name)}</h2>` +
    // The summary is the entry's first sentence; show it as the lede only when the body
    // does not already start with it (most entries do, so it would read twice).
    (i.summary && i.id !== "start" && !i.num && !plain(i.md).trimStart().startsWith(i.summary.toLowerCase().slice(0, 40)) ? `<p class="lede">${esc(i.summary)}</p>` : "") +
    (actions.length ? `<div class="actions">${actions.join("")}</div>` : "") +
    (i.id === "start" ? startPage() : "") +
    `<div class="md" id="md"></div>${pager(i)}</article>` +
    footer();
  const md = document.getElementById("md");
  md.innerHTML = window.marked ? marked.parse(i.md) : `<pre>${esc(i.md)}</pre>`;
  enhance(md, i.kind, i.id);
  readerEl.scrollTop = 0;
  document.body.classList.toggle("reading", i.id !== HOME || location.hash === `#${HOME}`);
  for (const r of indexEl.querySelectorAll(".row")) {
    if (r.dataset.id === i.id) r.setAttribute("aria-current", "true");
    else r.removeAttribute("aria-current");
  }
  const active = indexEl.querySelector(`.row[data-id="${CSS.escape(i.id)}"]`);
  active?.scrollIntoView({ block: "nearest" });
  document.title = i.id === HOME ? PAGE.doc_title : `${i.name} · ${PAGE.doc_title}`;
  if (focus) readerEl.focus({ preventScroll: true });
}

readerEl.addEventListener("click", async (e) => {
  const tab = e.target.closest(".codetabs .tab");
  if (tab) {
    setLang(tab.dataset.lang, tab.closest(".codetabs"));
    return;
  }
  const copyCode = e.target.closest(".codetabs .copy");
  if (copyCode) {
    const pre = [...copyCode.closest(".codetabs").querySelectorAll("pre")].find((p) => !p.hidden);
    try {
      await navigator.clipboard.writeText(pre.textContent);
      copyCode.textContent = "Copied";
    } catch {
      copyCode.textContent = "Select and copy";
    }
    setTimeout(() => (copyCode.textContent = "Copy"), 1400);
    return;
  }
  const copy = e.target.closest("[data-copy], [data-copy-name]");
  if (copy) {
    const text = copy.dataset.copy ?? copy.dataset.copyName;
    const label = copy.innerHTML;
    try {
      await navigator.clipboard.writeText(text);
      copy.textContent = "Copied";
    } catch {
      copy.textContent = text; // clipboard refused: show the text so it can be selected
    }
    setTimeout(() => (copy.innerHTML = label), 1400);
    return;
  }
  if (e.target.closest("[data-back]")) {
    document.body.classList.remove("reading");
    return;
  }
  const stat = e.target.closest("[data-filter]");
  if (stat) {
    kindFilter = stat.dataset.filter;
    store.set(`alapi.kind.${PAGE.id}`, kindFilter);
    renderFilters();
    renderIndex();
    document.body.classList.remove("reading");
    indexEl.scrollTop = 0;
  }
});

/* Navigation: the hash is the entry id, so every entry has a link. */
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  show(byId.has(id) ? id : HOME);
}
window.addEventListener("hashchange", route);
indexEl.addEventListener("click", (e) => {
  const r = e.target.closest(".row");
  if (r && location.hash === `#${r.dataset.id}`) {
    e.preventDefault();
    show(r.dataset.id); // same entry: re-open it (on a phone, from the index)
    document.body.classList.add("reading");
  }
});

/* Search input, debounced lightly. */
const qEl = document.getElementById("q");
let t;
qEl.addEventListener("input", () => {
  clearTimeout(t);
  t = setTimeout(() => {
    query = qEl.value;
    renderIndex();
    indexEl.scrollTop = 0;
    document.body.classList.remove("reading");
  }, 60);
});

/* Keyboard: "/" to search, arrows to move through results, Enter to open, Esc to clear. */
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== qEl) {
    e.preventDefault();
    qEl.focus();
    qEl.select();
    return;
  }
  if (document.activeElement !== qEl) return;
  if (e.key === "Escape") {
    qEl.value = "";
    query = "";
    renderIndex();
  } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!shown.length) return;
    const at = shown.findIndex((i) => i.id === current?.id);
    const next = e.key === "ArrowDown" ? Math.min(shown.length - 1, at + 1) : Math.max(0, at - 1);
    location.hash = shown[next].id;
  } else if (e.key === "Enter" && shown.length) {
    const target = shown.find((i) => i.id === current?.id) ?? shown[0];
    if (location.hash !== `#${target.id}`) location.hash = target.id;
    document.body.classList.add("reading");
    readerEl.focus({ preventScroll: true });
  }
});

renderFilters();
renderIndex();
route();
</script>

</body>
</html>
