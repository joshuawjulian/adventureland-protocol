<style>
/* Layout: a sticky search bar over two panes, an index on the left and the reader on the right.
   On a phone the panes stack and the reader takes over, with a back button to the index. */
:root {
  --bg: #f4f6f2;
  --panel: #ffffff;
  --sunk: #ebeee8;
  --ink: #1b221e;
  --ink-soft: #3a4540;
  --muted: #5f6b64;
  --rule: #d9dfd8;
  --accent: #2b7556;
  --accent-ink: #ffffff;
  --mark: #fde68a;
  --send: #2b7556;
  --recv: #9a6412;
  --code: #a83a50;
  --g: #6347b2;
  --s: #2d68a6;
  --guide: #56626b;
  --learn: #b04a2a;
  --game: #7a5a12;
  --hl-kw: #8a3fb0; --hl-str: #2b7556; --hl-num: #a8551c; --hl-com: #7a857e; --hl-fn: #2d68a6; --hl-type: #9a6412;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --index-w: 360px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --panel: #171c19; --sunk: #1d2420; --ink: #e2e8e3; --ink-soft: #c3ccc6;
    --muted: #8f9c94; --rule: #2a332e; --accent: #6cc59a; --accent-ink: #0d1a14; --mark: #6b5414;
    --send: #6cc59a; --recv: #e0ad52; --code: #ec8fa1; --g: #ab96ef; --s: #7fb3ea; --guide: #a9b5bd;
    --learn: #ee9a7c; --game: #d9b25e;
    --hl-kw: #c79bf0; --hl-str: #8fd3ad; --hl-num: #f0a875; --hl-com: #7f8c85; --hl-fn: #8fbff0; --hl-type: #e8c27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --panel: #171c19; --sunk: #1d2420; --ink: #e2e8e3; --ink-soft: #c3ccc6;
  --muted: #8f9c94; --rule: #2a332e; --accent: #6cc59a; --accent-ink: #0d1a14; --mark: #6b5414;
  --send: #6cc59a; --recv: #e0ad52; --code: #ec8fa1; --g: #ab96ef; --s: #7fb3ea; --guide: #a9b5bd;
   --learn: #ee9a7c; --game: #d9b25e;
  --hl-kw: #c79bf0; --hl-str: #8fd3ad; --hl-num: #f0a875; --hl-com: #7f8c85; --hl-fn: #8fbff0; --hl-type: #e8c27a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--body);
  display: flex;
  flex-direction: column;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px 18px;
  flex-wrap: wrap;
  padding: 12px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 {
  margin: 0;
  font: 700 19px/1.1 var(--display);
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.brand .wire {
  font: 500 11px var(--mono);
  color: var(--muted);
  white-space: nowrap;
}
.search {
  flex: 1 1 320px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  background: var(--sunk);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 0 10px;
}
.search:focus-within { border-color: var(--accent); }
.search svg { flex: none; color: var(--muted); }
#q {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: 15px var(--body);
  padding: 9px 0;
  outline: none;
}
kbd {
  font: 500 11px var(--mono);
  color: var(--muted);
  border: 1px solid var(--rule);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 5px;
  background: var(--panel);
}
.theme-btn {
  border: 1px solid var(--rule);
  background: var(--panel);
  color: var(--ink-soft);
  border-radius: 8px;
  font: 500 12px var(--body);
  padding: 7px 10px;
  cursor: pointer;
}

/* Filters */
.filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 10px 16px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--rule);
  background: var(--panel);
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 3px 11px;
  font: 500 12.5px var(--body);
  cursor: pointer;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--k, var(--muted)); }
.chip b { font: 500 11px var(--mono); color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--k, var(--accent)); background: var(--sunk); color: var(--ink); }

/* Panes */
.panes {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: var(--index-w) minmax(0, 1fr);
}
.index {
  border-right: 1px solid var(--rule);
  overflow-y: auto;
  background: var(--panel);
  min-height: 0;
}
.reader { overflow-y: auto; min-height: 0; min-width: 0; }

/* Index list */
.status { font: 12px var(--body); color: var(--muted); padding: 10px 16px 4px; }
.group-h {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--panel);
  padding: 12px 16px 6px;
  font: 600 11px var(--body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid var(--rule);
}
.group-h span:last-child { font-family: var(--mono); letter-spacing: 0; }
ul.list { list-style: none; margin: 0; padding: 4px 0; }
.row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 2px 10px;
  padding: 7px 16px 7px 13px;
  border-left: 3px solid transparent;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.row:hover { background: var(--sunk); }
.row[aria-current="true"] { background: var(--sunk); border-left-color: var(--k); }
.row .tag {
  grid-row: span 2;
  align-self: start;
  margin-top: 3px;
  font: 600 9.5px var(--mono);
  letter-spacing: 0.04em;
  color: var(--k);
  border: 1px solid currentColor;
  border-radius: 3px;
  padding: 0 4px;
  min-width: 38px;
  text-align: center;
}
.row .name {
  font: 500 13.5px var(--mono);
  color: var(--ink);
  overflow-wrap: anywhere;
}
.row .name.prose { font: 500 14px var(--body); }
.row .name small { font: 11px var(--mono); color: var(--muted); margin-left: 6px; }
.row .sum {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.4;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.more { padding: 10px 16px 18px; font-size: 12.5px; color: var(--muted); }

/* Reader */
.doc {
  max-width: 860px;
  padding: 28px 32px 64px;
}
.btn.back { display: none; } /* .btn sets display, so this needs the extra class to win */
.filters[hidden] { display: none; }
.crumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font: 500 12px var(--body);
  color: var(--muted);
}
.kind-pill {
  font: 600 10.5px var(--mono);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--k);
  border: 1px solid currentColor;
  border-radius: 4px;
  padding: 1px 6px;
}
.doc h2.title {
  margin: 10px 0 4px;
  font: 700 clamp(24px, 3.4vw, 34px)/1.15 var(--display);
  letter-spacing: -0.015em;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.doc h2.title.mono { font-family: var(--mono); font-weight: 600; letter-spacing: -0.02em; }
.lede { margin: 0 0 18px; color: var(--ink-soft); font-size: 16px; max-width: 68ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--rule);
  background: var(--panel);
  color: var(--ink-soft);
  border-radius: 7px;
  padding: 6px 11px;
  font: 500 12.5px var(--body);
  cursor: pointer;
  text-decoration: none;
}
.btn:hover { border-color: var(--accent); color: var(--ink); }
.btn code { font: 12px var(--mono); }

/* Prose stays at a readable measure; code examples and tables may use the full column. */
.md { font-size: 15px; }
.md > :is(p, ul, ol, blockquote, h2, h3, h4, h5, h6) { max-width: 72ch; }
.md p, .md li { color: var(--ink-soft); }
.md strong { color: var(--ink); font-weight: 600; }
.md h2, .md h3, .md h4 {
  font-family: var(--display);
  color: var(--ink);
  letter-spacing: -0.01em;
  margin: 28px 0 8px;
  text-wrap: balance;
}
.md h2 { font-size: 22px; }
.md h3 { font-size: 18px; }
.md h4 { font-size: 15.5px; }
.md code {
  font: 0.88em var(--mono);
  background: var(--sunk);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 0 4px;
  overflow-wrap: anywhere;
}
.md pre {
  background: var(--sunk);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 12px 14px;
  overflow-x: auto;
  max-width: 100%;
}
.md pre code { background: none; border: 0; padding: 0; overflow-wrap: normal; font-size: 13px; }
.md a.xref { text-decoration: none; }
.md a.xref code { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--rule)); }
.md a.xref:hover code { background: var(--panel); }
.md a.src { font: 0.88em var(--mono); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.md blockquote {
  margin: 16px 0;
  padding: 10px 14px;
  border: 1px solid var(--rule);
  border-left: 3px solid var(--recv);
  border-radius: 0 8px 8px 0;
  background: var(--panel);
}
.md blockquote p { margin: 4px 0; }
.table-wrap { overflow-x: auto; max-width: 100%; margin: 12px 0 18px; border: 1px solid var(--rule); border-radius: 8px; }
/* Pictures: the game's own art. A paragraph that is only `![alt](src "caption")` becomes a figure
   (enhance). The files are made at their display size, so pixelated keeps the pixel art sharp when
   a high-density screen scales them up. */
.md figure { margin: 16px 0 20px; max-width: 100%; }
.md figure img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 8px; image-rendering: pixelated; }
.md figcaption { margin-top: 6px; font-size: 13px; color: var(--muted); max-width: 72ch; }
.md table { border-collapse: collapse; font-size: 13.5px; width: 100%; }
.md th, .md td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--rule); }
.md th { font: 600 11px var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.md td:first-child code { white-space: nowrap; }
/* Type names and code links in schema tables must not wrap mid-word ("ItemN/ame"). */
.md td:nth-child(2) code, .md td:last-child a code { white-space: nowrap; }

/* Start page */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin: 4px 0 26px;
}
.stat {
  text-align: left;
  border: 1px solid var(--rule);
  border-top: 3px solid var(--k);
  background: var(--panel);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  color: inherit;
  font: inherit;
}
.stat:hover { background: var(--sunk); }
.stat b { display: block; font: 700 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }

.foot {
  max-width: 860px;
  margin: 0 32px 40px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
  font-size: 12.5px;
  color: var(--muted);
}

/* Page switcher (Build a bot / Game guide / API reference) and the code-language picker. */
.pages { display: flex; gap: 2px; background: var(--sunk); border: 1px solid var(--rule); border-radius: 8px; padding: 2px; }
.pages a {
  font: 500 13px var(--body);
  color: var(--ink-soft);
  text-decoration: none;
  padding: 5px 10px;
  border-radius: 6px;
  white-space: nowrap;
}
.pages a:hover { color: var(--ink); }
.pages a[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
.lang-pick { display: flex; align-items: center; gap: 6px; font: 500 12px var(--body); color: var(--muted); }
.lang-pick select {
  font: 500 12.5px var(--body);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 6px 8px;
}

/* A run of fenced blocks in the course's languages becomes one tabbed example. */
.codetabs { margin: 14px 0 20px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sunk); max-width: 100%; }
.codetabs .tabbar {
  display: flex;
  align-items: center;
  gap: 2px;
  overflow-x: auto;
  border-bottom: 1px solid var(--rule);
  padding: 4px 4px 0;
}
.codetabs .tab {
  border: 0;
  background: none;
  color: var(--muted);
  font: 500 12.5px var(--body);
  padding: 6px 10px 7px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}
.codetabs .tab:hover { color: var(--ink); }
.codetabs .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.codetabs .copy { margin-left: auto; flex: none; font: 500 12px var(--body); border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px 8px; }
.codetabs .copy:hover { color: var(--accent); }
.codetabs pre { margin: 0; border: 0; border-radius: 0 0 8px 8px; }
.codetabs .note { font: 12px var(--body); color: var(--muted); padding: 8px 14px 0; }
.md pre { position: relative; }

/* highlight.js token colours, themed with the page. */
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-meta .hljs-keyword { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-template-string, .hljs-char { color: var(--hl-str); }
.hljs-number { color: var(--hl-num); }
.hljs-comment, .hljs-doctag, .hljs-meta { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-property { color: var(--hl-fn); }
.hljs-type, .hljs-title.class_, .hljs-attr, .hljs-params .hljs-type { color: var(--hl-type); }

/* Previous / next chapter, on the teaching pages. */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 36px 0 0; max-width: 72ch; }
.pager a {
  display: block;
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 10px 12px;
  text-decoration: none;
  color: var(--ink);
  background: var(--panel);
  font: 600 14px var(--display);
}
.pager a:hover { border-color: var(--accent); }
.pager a span { display: block; font: 500 11.5px var(--body); color: var(--muted); margin-bottom: 2px; }
.pager .next { text-align: right; grid-column: 2; }

.empty { padding: 24px 16px; color: var(--muted); font-size: 14px; }

@media (max-width: 1360px) {
  .brand .wire { display: none; }
}
@media (max-width: 860px) {
  .panes { grid-template-columns: minmax(0, 1fr); }
  .index { border-right: 0; }
  body.reading .index { display: none; }
  body:not(.reading) .reader { display: none; }
  .btn.back { display: inline-flex; margin-bottom: 14px; }
  .doc { padding: 20px 16px 48px; }
  .md figure img { image-rendering: auto; } /* scaled down on a phone: smooth reads better */
  .foot { margin: 0 16px 32px; }
  .brand .wire { display: none; }
  .pages { order: 3; flex: 1 1 100%; }
  .pages a { flex: 1; text-align: center; padding: 6px 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  .row, .chip, .btn, .stat { transition: background-color 0.12s, border-color 0.12s; }
}
</style>
